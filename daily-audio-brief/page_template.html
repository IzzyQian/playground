<title>Izzy's Morning Update</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-title" content="Morning">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow phone-first column — player first, then headlines, then the day's schedule. */
:root {
  --bg: #F3F5F8;        /* pale early-morning sky */
  --surface: #FFFFFF;
  --ink: #17233A;       /* deep pre-dawn blue */
  --ink-soft: #5A6578;
  --line: #DCE1E9;
  --sun: #E8892B;       /* sunrise amber, used only for the play control and progress */
  --sun-ink: #FFFFFF;
  --flag: #B5541C;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1422; --surface: #172036; --ink: #E9EDF5; --ink-soft: #9AA5BA;
    --line: #26314A; --sun: #F0A050; --sun-ink: #1A1206; --flag: #F2A06B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1422; --surface: #172036; --ink: #E9EDF5; --ink-soft: #9AA5BA;
  --line: #26314A; --sun: #F0A050; --sun-ink: #1A1206; --flag: #F2A06B; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
p { margin: 0; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 8vw, 40px); line-height: 1.08; margin: 6px 0 10px; text-wrap: balance; }
.summary { color: var(--ink-soft); font-size: 17px; }

.player { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.player-row { display: flex; align-items: center; gap: 16px; }
.play {
  flex: none; width: 68px; height: 68px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--sun); color: var(--sun-ink); display: grid; place-items: center;
}
.play:focus-visible, .chip:focus-visible, .skip:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.play svg { width: 28px; height: 28px; fill: currentColor; }
.player-meta { min-width: 0; flex: 1; }
.player-title { font-weight: 600; font-size: 17px; }
.player-time { color: var(--ink-soft); font-size: 14px; font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 6px; border-radius: 3px; background: var(--line); cursor: pointer; touch-action: none; }
.bar-fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 3px; background: var(--sun); }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
.chip, .skip {
  font: 500 14px var(--body); color: var(--ink); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 14px; cursor: pointer; font-variant-numeric: tabular-nums;
}
.chip { margin-left: auto; min-width: 64px; }

h2 { font-family: var(--display); font-weight: 500; font-size: 22px; margin: 0 0 12px; }
ol, ul { list-style: none; margin: 0; padding: 0; }
.headlines li { padding: 14px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.h-topic { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.h-title { font-weight: 600; }
.h-detail { color: var(--ink-soft); font-size: 15px; }
.h-detail a { color: var(--ink-soft); text-underline-offset: 3px; white-space: nowrap; }

.schedule li { display: grid; grid-template-columns: 88px 1fr; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.ev-time { display: flex; flex-direction: column; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; }
.ev-end { color: var(--ink-soft); font-weight: 400; font-size: 13px; }
.ev-body { min-width: 0; }
.ev-title { font-weight: 600; }
.ev-where { color: var(--ink-soft); font-size: 15px; }
.ev-note { color: var(--flag); font-size: 14px; font-weight: 500; margin-top: 2px; }
.ev-empty { color: var(--ink-soft); padding: 14px 0; border-top: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<main>
  <header>
    <p class="eyebrow">Morning Update · {{DAY_LABEL}}</p>
    <h1>Good morning, Izzy.</h1>
    <p class="summary">{{SUMMARY}}</p>
  </header>

  <section class="player" aria-label="Audio player">
    <div class="player-row">
      <button class="play" id="play" aria-label="Play">
        <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <div class="player-meta">
        <p class="player-title">Today's briefing</p>
        <p class="player-time"><span id="cur">0:00</span> / <span id="dur">–:––</span></p>
      </div>
    </div>
    <div class="bar" id="bar" role="slider" aria-label="Position" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar-fill" id="fill"></div></div>
    <div class="controls">
      <button class="skip" id="back">−15s</button>
      <button class="skip" id="fwd">+15s</button>
      <button class="chip" id="rate" aria-label="Playback speed">1×</button>
    </div>
    <audio id="audio" preload="metadata" src="data:audio/mpeg;base64,{{AUDIO_B64}}"></audio>
  </section>

  <section>
    <h2>Headlines</h2>
    <ol class="headlines">
{{HEADLINES}}
    </ol>
  </section>

  <section>
    <h2>Your day</h2>
    <ul class="schedule">
{{EVENTS}}
    </ul>
  </section>
</main>

<script>
(() => {
  const DATE = "{{DATE}}";
  const a = document.getElementById("audio");
  const play = document.getElementById("play");
  const iPlay = document.getElementById("icon-play"), iPause = document.getElementById("icon-pause");
  const cur = document.getElementById("cur"), dur = document.getElementById("dur");
  const bar = document.getElementById("bar"), fill = document.getElementById("fill");
  const fmt = s => isFinite(s) ? Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0") : "–:––";
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  const savedRate = parseFloat(store.get("rate")) || 1;
  const RATES = [1, 1.25, 1.5, 0.9];
  const rateBtn = document.getElementById("rate");
  function setRate(r) {
    a.playbackRate = r; store.set("rate", r);
    rateBtn.textContent = r + "×";
  }
  rateBtn.addEventListener("click", () => setRate(RATES[(RATES.indexOf(a.playbackRate) + 1) % RATES.length] || 1));
  setRate(savedRate);

  a.addEventListener("loadedmetadata", () => {
    dur.textContent = fmt(a.duration);
    const pos = parseFloat(store.get("pos-" + DATE));
    if (pos && pos < a.duration - 5) a.currentTime = pos;
    setRate(savedRate);
  });
  a.addEventListener("timeupdate", () => {
    cur.textContent = fmt(a.currentTime);
    const pct = a.duration ? (a.currentTime / a.duration) * 100 : 0;
    fill.style.width = pct + "%"; bar.setAttribute("aria-valuenow", Math.round(pct));
    store.set("pos-" + DATE, a.currentTime);
  });
  const sync = () => {
    const p = a.paused; iPlay.hidden = !p; iPause.hidden = p;
    play.setAttribute("aria-label", p ? "Play" : "Pause");
  };
  a.addEventListener("play", sync); a.addEventListener("pause", sync);
  a.addEventListener("ended", () => store.set("pos-" + DATE, 0));
  play.addEventListener("click", () => a.paused ? a.play() : a.pause());
  document.getElementById("back").addEventListener("click", () => a.currentTime = Math.max(0, a.currentTime - 15));
  document.getElementById("fwd").addEventListener("click", () => a.currentTime = Math.min(a.duration || 0, a.currentTime + 15));

  function seek(e) {
    const r = bar.getBoundingClientRect();
    if (a.duration) a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
  }
  bar.addEventListener("pointerdown", e => { seek(e); bar.setPointerCapture(e.pointerId); bar.onpointermove = seek; });
  bar.addEventListener("pointerup", () => { bar.onpointermove = null; });
  bar.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") a.currentTime += 5;
    if (e.key === "ArrowLeft") a.currentTime -= 5;
  });

  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: "Morning Update", artist: "{{DAY_LABEL}}" });
      navigator.mediaSession.setActionHandler("play", () => a.play());
      navigator.mediaSession.setActionHandler("pause", () => a.pause());
    } catch (e) {}
  }
})();
</script>
